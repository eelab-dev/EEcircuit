name: Next Build Deploy Test Push

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_TOKEN: ${{secrets.PULL_REQ}}

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: eelab-dev/EEcircuit
          ref: next # Checkout the "next" branch
          path: EEcircuit

      - name: Checkout local schematic dependency
        uses: actions/checkout@v4
        with:
          repository: eelab-dev/EEcircuit-schematic
          path: EEcircuit-schematic

      - name: Install locked dependencies
        run: npm ci
        working-directory: EEcircuit

      - name: Audit dependencies
        run: npm audit
        working-directory: EEcircuit

      - name: Build Project with Vite
        run: npm run build
        working-directory: EEcircuit

      - name: Deploy to Vercel
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: EEcircuit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: EEcircuit

      - name: Run Playwright tests
        run: xvfb-run -a npx playwright test --project=chrome --workers=1 -g "EEcircuit Next"
        working-directory: EEcircuit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: EEcircuit/playwright-report/
          retention-days: 30
